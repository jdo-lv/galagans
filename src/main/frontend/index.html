    <title>Crew Health Companion</title>
    <script>
      // The theme picked in the app (useTheme.ts), applied before the first paint so the splash matches it.
      try {
        const theme = localStorage.getItem('crew-health.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>

    <!-- splash:start -->
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash-brand">

          <path class="splash-ring-arc" d="M14 3 A11 11 0 0 1 23.53 8.5" />
        </svg>
        <p class="splash-wordmark">Health</p>
      </div>
      <p class="splash-credit">Built for the NASA Space Apps Challenge 2026</p>
    </div>
    <!-- splash:end -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
