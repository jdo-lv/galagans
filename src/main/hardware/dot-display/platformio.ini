; Dot display firmware for Waveshare's 1.47" touch display boards. README.md has the commands.
;   pio run -t upload         build and flash the ESP32-C6 board (env "c6", the team's board)
;   pio run -e s3 -t upload   the same for the ESP32-S3-Touch-LCD-1.47
;   pio test -e native        run the logic tests on this machine
; Pins per board: src/Board.h.

[platformio]
default_envs = c6

[board]
; Arduino-ESP32 core 3.3.12 via pioarduino: Waveshare's demos need core 3 (ledcAttach).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Serial over the board's own USB-C port, the chip's USB-Serial/JTAG (the C6 has no other USB)
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ; Waveshare's demos ship 1.5.9, which doesn't build on core 3.3 (spiFrequencyToClockDiv changed)
    moononournation/GFX Library for Arduino @ 1.6.9
    ; fonts only (Helvetica bitmaps)
    olikraus/U8g2 @ 2.36.18
    links2004/WebSockets @ 2.7.3
    bblanchon/ArduinoJson @ 7.4.3
; Creates include/config.h from config.example.h on the first build.
extra_scripts = pre:scripts/ensure_config.py

[env:c6]
; Waveshare ESP32-C6-Touch-LCD-1.47: ESP32-C6FH8, single core, 8 MB flash in the chip
extends = board
board = esp32-c6-devkitc-1
; 3.2 MB app slots instead of 1.3 MB: server mode fills 98 % of the default
board_build.partitions = default_8MB.csv

[env:s3]
; Waveshare ESP32-S3-Touch-LCD-1.47: ESP32-S3R8
extends = board
board = esp32-s3-devkitc-1

[env:native]
; The pure logic in lib/dotcore, tested on the development machine.
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
