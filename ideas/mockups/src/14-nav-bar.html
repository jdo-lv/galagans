<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* Home with the navigation bar, iPad 7 landscape (1080 × 810 CSS px), dark tokens from src/ui/theme/tokens.css.
   Only the bar is in scope; header and panels are faded context from the home wireframe. */
:root{--bg:#1B1B1B;--surface:#52574E;--text:#DADADA;--muted:#868375;--edge:#868375;--inv-bg:#DADADA;--inv-text:#1B1B1B;--ring:#868375}
body{width:1080px;height:810px;background:var(--bg);color:var(--text)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic.s22{width:22px;height:22px}

.head{position:absolute;left:20px;right:20px;top:10px;height:52px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.word{font-weight:500;font-size:16px;letter-spacing:.08em}
.hact{justify-self:end;display:flex;gap:18px}
.ibtn{width:52px;height:52px;border-radius:999px;display:grid;place-items:center}

.ctx{opacity:.4}
.card{position:absolute;background:var(--surface);border-radius:16px}
.lab{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.row{height:58px;border-radius:12px;border:1px solid var(--edge);margin-top:10px}
.leg{width:84px;height:22px;border-radius:999px;border:1px solid var(--edge);margin-top:8px}
.line{height:1px;background:var(--bg);margin:0 0 0}
.ph{position:absolute;font-size:13px;color:var(--text)}

/* The navigation bar: surface pill with an edge, four 64 × 52 icon targets 18 px apart, selected = inverse pill */
.nav{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:18px;padding:8px;background:var(--surface);border:1px solid var(--edge);border-radius:999px}
.nav a{width:64px;height:52px;border-radius:999px;display:grid;place-items:center;color:var(--text)}
.nav a[aria-current]{background:var(--inv-bg);color:var(--inv-text)}
</style></head><body>
